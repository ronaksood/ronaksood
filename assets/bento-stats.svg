<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <!-- COLOR SYSTEM: Bento Grid Palette -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </linearGradient>

    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B293A" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B293A" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B293A" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B293A" stop-opacity="0.3" />
    </linearGradient>

    <filter id="valGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
      
      @keyframes breathe {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.015); }
      }

      .pulse-metric {
        transform-origin: center;
        animation: breathe 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- CARD 1: Aramco CV Benchmark -->
  <g transform="translate(0, 0)">
    <rect width="216" height="170" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad1)" stroke-width="1.2" />
    <circle cx="28" cy="30" r="4" fill="#00F2FE" />
    <text x="40" y="34" fill="#6A85A3" font-size="10" font-weight="700" class="mono" letter-spacing="1.2">ARAMCO CV INFERENCE</text>
    <text x="24" y="86" fill="#00F2FE" font-size="34" font-weight="800" class="sans pulse-metric" filter="url(#valGlow)">99.1%</text>
    <text x="24" y="118" fill="#E2EDF8" font-size="12" font-weight="600" class="sans">Analog Gauge CV Pipeline</text>
    <text x="24" y="136" fill="#7893B0" font-size="10.5" class="mono">Benchmarked on DGX A100</text>
    <text x="24" y="152" fill="#4B6685" font-size="9.5" class="mono">YOLOv5 • 4 Research Papers</text>
  </g>

  <!-- CARD 2: OmniTrace Police Investigation -->
  <g transform="translate(228, 0)">
    <rect width="216" height="170" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad2)" stroke-width="1.2" />
    <circle cx="28" cy="30" r="4" fill="#00FFA3" />
    <text x="40" y="34" fill="#6A85A3" font-size="10" font-weight="700" class="mono" letter-spacing="1.2">DIGITAL FORENSICS</text>
    <text x="24" y="86" fill="#00FFA3" font-size="25" font-weight="800" class="sans pulse-metric" filter="url(#valGlow)">Mo ➔ Mins</text>
    <text x="24" y="118" fill="#E2EDF8" font-size="12" font-weight="600" class="sans">OmniTrace Architecture</text>
    <text x="24" y="136" fill="#7893B0" font-size="10.5" class="mono">Chandigarh Police Demo</text>
    <text x="24" y="152" fill="#4B6685" font-size="9.5" class="mono">Neo4j • Louvain • PySpark</text>
  </g>

  <!-- CARD 3: Hackathons & Accolades -->
  <g transform="translate(456, 0)">
    <rect width="216" height="170" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad3)" stroke-width="1.2" />
    <circle cx="28" cy="30" r="4" fill="#FFB800" />
    <text x="40" y="34" fill="#6A85A3" font-size="10" font-weight="700" class="mono" letter-spacing="1.2">COMPETITIVE WINS</text>
    <text x="24" y="86" fill="#FFB800" font-size="34" font-weight="800" class="sans pulse-metric" filter="url(#valGlow)">7× Wins</text>
    <text x="24" y="118" fill="#E2EDF8" font-size="12" font-weight="600" class="sans">National Hackathons</text>
    <text x="24" y="136" fill="#7893B0" font-size="10.5" class="mono">₹2,00,000+ Prize Haul</text>
    <text x="24" y="152" fill="#4B6685" font-size="9.5" class="mono">Best Intern @ Grok Digital</text>
  </g>

  <!-- CARD 4: Academics & Rigor -->
  <g transform="translate(684, 0)">
    <rect width="216" height="170" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad4)" stroke-width="1.2" />
    <circle cx="28" cy="30" r="4" fill="#A78BFA" />
    <text x="40" y="34" fill="#6A85A3" font-size="10" font-weight="700" class="mono" letter-spacing="1.2">ACADEMIC RIGOR</text>
    <text x="24" y="86" fill="#A78BFA" font-size="34" font-weight="800" class="sans pulse-metric" filter="url(#valGlow)">Rank #1</text>
    <text x="24" y="118" fill="#E2EDF8" font-size="12" font-weight="600" class="sans">MCA DCSA Panjab Univ</text>
    <text x="24" y="136" fill="#7893B0" font-size="10.5" class="mono">84% Aggregate Score</text>
    <text x="24" y="152" fill="#4B6685" font-size="9.5" class="mono">Class XII 94% School Topper</text>
  </g>
</svg>
