<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- COLOR SYSTEM: Change these variables to retheme the entire hero banner -->
    <!-- PRIMARY ACCENT: Electric Cyan -->
    <!-- SECONDARY ACCENT: Neural Mint -->
    <!-- BACKGROUND: Deep Obsidian Space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E" />
      <stop offset="50%" stop-color="#0B111B" />
      <stop offset="100%" stop-color="#080D14" />
    </linearGradient>

    <linearGradient id="cyanMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>

    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16202E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E1622" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1D2A3D" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="0.75" fill="#4FACFE" fill-opacity="0.3" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanline {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3px; fill-opacity: 0.6; }
        50% { r: 5px; fill-opacity: 1; }
      }

      .floating-mesh { animation: floatSlow 8s ease-in-out infinite; }
      .pulsing-node { animation: nodePulse 3s ease-in-out infinite; }
      .laser-scan { animation: scanline 4s linear infinite; }
      .live-dot { animation: blink 1.2s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)" stroke="#1F2A38" stroke-width="1.2" />

  <!-- Grid Layer -->
  <rect width="900" height="320" rx="16" fill="url(#grid)" />

  <!-- Aurora Mesh Ambient Blobs -->
  <g class="floating-mesh">
    <ellipse cx="200" cy="120" rx="260" ry="110" fill="url(#auroraGlow)" filter="url(#glow)" />
    <ellipse cx="720" cy="200" rx="220" ry="90" fill="url(#auroraGlow)" filter="url(#glow)" />
  </g>

  <!-- Top Decorative HUD Bracket & Identity Tag -->
  <g transform="translate(45, 34)">
    <!-- Status Chip -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="url(#chipGrad)" stroke="#223347" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#00FFA3" class="live-dot" />
    <text x="30" y="18" fill="#00FFA3" font-size="11" font-weight="600" class="mono" letter-spacing="1.5">SYSTEM ACTIVE // OMNITRACE CORE</text>
    
    <!-- Top-Right Matrix Node Coordinates -->
    <text x="750" y="18" fill="#5A718C" font-size="10.5" font-weight="500" class="mono" letter-spacing="1.2">LOC: 30.7333°N / 76.7794°E [CHANDIGARH]</text>
  </g>

  <!-- Constellation Graph Topology (Representing Neo4j / Scaled Graph Architecture) -->
  <g opacity="0.45" stroke="#385473" stroke-width="0.8">
    <line x1="680" y1="75" x2="760" y2="120" />
    <line x1="760" y1="120" x2="840" y2="90" />
    <line x1="760" y1="120" x2="790" y2="190" />
    <line x1="790" y1="190" x2="710" y2="230" />
    <line x1="710" y1="230" x2="680" y2="75" />
    <line x1="760" y1="120" x2="710" y2="230" />

    <circle cx="680" cy="75" r="3" fill="#00F2FE" class="pulsing-node" />
    <circle cx="760" cy="120" r="4.5" fill="#00FFA3" filter="url(#softGlow)" />
    <circle cx="840" cy="90" r="3" fill="#4FACFE" />
    <circle cx="790" cy="190" r="3.5" fill="#00F2FE" />
    <circle cx="710" cy="230" r="4" fill="#00FFA3" class="pulsing-node" />
    <text x="772" y="124" fill="#6A89AA" font-size="9" class="mono">NEO4J//LOUVAIN</text>
  </g>

  <!-- Hero Typography Section -->
  <g transform="translate(45, 110)">
    <!-- Sub-headline category -->
    <text x="0" y="0" fill="#4FACFE" font-size="12" font-weight="700" class="mono" letter-spacing="3.5">
      AI ENGINEER &amp; DISTRIBUTED SYSTEMS ARCHITECT
    </text>

    <!-- Main Name Title -->
    <text x="0" y="48" fill="url(#cyanMint)" font-size="46" font-weight="800" class="sans" letter-spacing="-0.5" filter="url(#softGlow)">
      RONAK SOOD
    </text>

    <!-- Technical Descriptor -->
    <text x="0" y="82" fill="#C9D6E4" font-size="15" font-weight="400" class="sans" letter-spacing="0.2">
      Cutting investigations from <tspan fill="#00FFA3" font-weight="600">months to minutes</tspan> with multi-agent RAG, graph analytics &amp; PySpark.
    </text>
    <text x="0" y="104" fill="#7E93A9" font-size="13" font-weight="400" class="mono">
      Benchmarked on NVIDIA DGX A100 &amp; Thor  •  Ex-Grok Digital (Aramco AI)  •  7× National Winner
    </text>
  </g>

  <!-- Bottom Metric / Proof Pills -->
  <g transform="translate(45, 252)">
    <!-- Pill 1: Hackathons -->
    <g transform="translate(0, 0)">
      <rect width="186" height="32" rx="7" fill="#111A26" stroke="#253549" stroke-width="1" />
      <circle cx="16" cy="16" r="3" fill="#FFB800" />
      <text x="28" y="20" fill="#E2EDF8" font-size="11" font-weight="600" class="mono">7× HACKATHON WINNER</text>
    </g>

    <!-- Pill 2: OmniTrace -->
    <g transform="translate(198, 0)">
      <rect width="210" height="32" rx="7" fill="#111A26" stroke="#253549" stroke-width="1" />
      <circle cx="16" cy="16" r="3" fill="#00F2FE" />
      <text x="28" y="20" fill="#E2EDF8" font-size="11" font-weight="600" class="mono">CHANDIGARH POLICE AI</text>
    </g>

    <!-- Pill 3: Aramco CV Benchmark -->
    <g transform="translate(420, 0)">
      <rect width="194" height="32" rx="7" fill="#111A26" stroke="#253549" stroke-width="1" />
      <circle cx="16" cy="16" r="3" fill="#00FFA3" />
      <text x="28" y="20" fill="#E2EDF8" font-size="11" font-weight="600" class="mono">99.1% ARAMCO CV (DGX)</text>
    </g>

    <!-- Pill 4: Academics -->
    <g transform="translate(626, 0)">
      <rect width="184" height="32" rx="7" fill="#111A26" stroke="#253549" stroke-width="1" />
      <circle cx="16" cy="16" r="3" fill="#A78BFA" />
      <text x="28" y="20" fill="#E2EDF8" font-size="11" font-weight="600" class="mono">MCA RANK 1 (PU)</text>
    </g>
  </g>

  <!-- Bottom Animated Glowing Laser Scanline -->
  <g transform="translate(0, 318)">
    <line x1="0" y1="0" x2="900" y2="0" stroke="url(#laserLine)" stroke-width="2.5" />
    <rect x="0" y="-1" width="180" height="2" fill="#00F2FE" class="laser-scan" opacity="0.9" filter="url(#softGlow)" />
  </g>
</svg>
