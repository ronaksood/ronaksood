<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    <!-- COLOR SYSTEM: Terminal Palette -->
    <!-- WINDOW BG: #0A0F18 -->
    <!-- ACCENTS: #00F2FE (Cyan), #00FFA3 (Mint), #FFB800 (Amber), #FF5F56 (Red) -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B4E" />
      <stop offset="50%" stop-color="#162232" />
      <stop offset="100%" stop-color="#2D3B4E" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162233" />
      <stop offset="100%" stop-color="#0E1624" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .term-text {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      
      @keyframes lineReveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulseSignal {
        0%, 100% { fill-opacity: 0.4; }
        50% { fill-opacity: 1; }
      }

      /* Staggered sequential terminal boot sequence */
      .l1 { animation: lineReveal 0.4s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .l2 { animation: lineReveal 0.4s ease forwards; animation-delay: 0.8s; opacity: 0; }
      .l3 { animation: lineReveal 0.4s ease forwards; animation-delay: 1.4s; opacity: 0; }
      .l4 { animation: lineReveal 0.4s ease forwards; animation-delay: 2.0s; opacity: 0; }
      .l5 { animation: lineReveal 0.4s ease forwards; animation-delay: 2.6s; opacity: 0; }
      .l6 { animation: lineReveal 0.4s ease forwards; animation-delay: 3.2s; opacity: 0; }
      .l7 { animation: lineReveal 0.4s ease forwards; animation-delay: 3.8s; opacity: 0; }
      .l8 { animation: lineReveal 0.4s ease forwards; animation-delay: 4.4s; opacity: 0; }

      .cursor {
        animation: blinkCursor 0.9s infinite;
        animation-delay: 4.6s;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="900" height="370" rx="14" fill="#080D15" stroke="url(#termBorder)" stroke-width="1.4" />

  <!-- Window Header Bar -->
  <rect width="900" height="40" rx="14" fill="url(#headerGrad)" />
  <!-- Corner correction so bottom corners of header aren't rounded -->
  <rect y="26" width="900" height="14" fill="url(#headerGrad)" />
  <line x1="0" y1="40" x2="900" y2="40" stroke="#1D2A3A" stroke-width="1" />

  <!-- Window Control Buttons (macOS-style) -->
  <circle cx="28" cy="20" r="5.5" fill="#FF5F56" />
  <circle cx="48" cy="20" r="5.5" fill="#FFBD2E" />
  <circle cx="68" cy="20" r="5.5" fill="#27C93F" />

  <!-- Header Title & Active Host -->
  <g transform="translate(450, 24)" text-anchor="middle">
    <text fill="#6B85A2" font-size="11.5" font-family="ui-monospace, monospace" font-weight="600" letter-spacing="1">
      ronak@quantum-node01: ~/production/telemetry (zsh)
    </text>
  </g>

  <!-- Live Status LED in Header -->
  <g transform="translate(865, 20)">
    <circle cx="0" cy="0" r="4.5" fill="#00FFA3" style="animation: pulseSignal 2s infinite ease-in-out;" />
  </g>

  <!-- Terminal Output Buffer -->
  <g transform="translate(32, 74)" class="term-text">
    <!-- Command Line 1 -->
    <g class="l1">
      <text x="0" y="0" fill="#00F2FE" font-weight="600">ronak@node01:~$</text>
      <text x="145" y="0" fill="#F0F6FC" font-weight="500">whoami --telemetry --spec=deepmind</text>
    </g>

    <!-- Output Line 2: Identity -->
    <g class="l2">
      <text x="0" y="28" fill="#587291">› IDENTITY   :</text>
      <text x="145" y="28" fill="#FFFFFF" font-weight="700">Ronak Sood</text>
      <text x="245" y="28" fill="#7895B2">| Software Development Engineer &amp; GenAI Architect</text>
    </g>

    <!-- Output Line 3: Core Architecture -->
    <g class="l3">
      <text x="0" y="56" fill="#587291">› CORE FOCUS :</text>
      <text x="145" y="56" fill="#00FFA3" font-weight="600">Distributed Backends  •  Graph Databases (Neo4j)  •  Agentic RAG</text>
    </g>

    <!-- Output Line 4: Flagship OmniTrace -->
    <g class="l4">
      <text x="0" y="84" fill="#587291">› FLAGSHIP   :</text>
      <text x="145" y="84" fill="#00F2FE" font-weight="600">OmniTrace</text>
      <text x="235" y="84" fill="#C9D6E4">→ Ingests billions of CDR/banking records for Chandigarh Police</text>
      <text x="760" y="84" fill="#FFB800" font-weight="600">[2mo ➔ 10min]</text>
    </g>

    <!-- Output Line 5: Aramco & Hardware -->
    <g class="l5">
      <text x="0" y="112" fill="#587291">› ENTERPRISE :</text>
      <text x="145" y="112" fill="#C9D6E4">Grok Digital (Best Intern) → Aramco Industrial CV (YOLOv5, OCR)</text>
      <text x="690" y="112" fill="#00FFA3" font-weight="600">[99.1% on DGX A100]</text>
    </g>

    <!-- Output Line 6: Engine Specs -->
    <g class="l6">
      <text x="0" y="140" fill="#587291">› STACK CORE :</text>
      <text x="145" y="140" fill="#88A4C4">PySpark  •  Iceberg  •  MinIO  •  FastAPI  •  PostgreSQL  •  LangGraph  •  Qwen 2.5</text>
    </g>

    <!-- Output Line 7: Accolades -->
    <g class="l7">
      <text x="0" y="168" fill="#587291">› MILESTONES :</text>
      <text x="145" y="168" fill="#FFB800" font-weight="600">7× National Hackathon Winner</text>
      <text x="400" y="168" fill="#C9D6E4">| MCA Rank 1 (84% Sem 1 &amp; 2) | STAIR Eval 93%</text>
    </g>

    <!-- Prompt Line 8 with Blinking Cursor -->
    <g class="l8">
      <text x="0" y="206" fill="#00F2FE" font-weight="600">ronak@node01:~$</text>
      <text x="145" y="206" fill="#F0F6FC">./deploy_solution.sh --target=high-impact-systems</text>
      <rect x="585" y="193" width="9" height="16" fill="#00FFA3" class="cursor" />
    </g>
  </g>

  <!-- Bottom Diagnostic Telemetry Bar -->
  <g transform="translate(0, 332)">
    <rect width="900" height="38" rx="0" fill="#0A111B" stroke="#1B293A" stroke-width="1" />
    
    <g transform="translate(32, 23)" class="term-text" font-size="11">
      <text fill="#486280">THREADS: <tspan fill="#00FFA3" font-weight="600">64/64 ACTIVE</tspan></text>
      <text x="180" fill="#486280">MEMORY: <tspan fill="#00F2FE" font-weight="600">3.2 GB / 64 GB</tspan></text>
      <text x="360" fill="#486280">CLUSTER: <tspan fill="#C9D6E4" font-weight="600">NVIDIA DGX A100 // THOR</tspan></text>
      <text x="630" fill="#486280">LATENCY: <tspan fill="#00FFA3" font-weight="600">0.82 ms</tspan></text>
      <text x="760" fill="#486280">STATUS: <tspan fill="#00FFA3" font-weight="600">NOMINAL ✓</tspan></text>
    </g>
  </g>
</svg>
