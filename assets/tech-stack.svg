      <rect x="160" y="34" width="88" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="204" y="51" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">YOLOv5 / CV</text>

