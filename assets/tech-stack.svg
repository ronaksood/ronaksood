      <text x="36" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">OpenCV</text>

      <rect x="80" y="68" width="80" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
