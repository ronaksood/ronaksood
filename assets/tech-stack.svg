<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- COLOR SYSTEM: Tech Matrix Palette -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </linearGradient>

    <linearGradient id="chipBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142336" />
      <stop offset="100%" stop-color="#0C1522" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }

      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      .pulse-border {
        animation: borderPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- COLUMN 1: DISTRIBUTED SYSTEMS & DATA PIPELINES -->
  <g transform="translate(0, 0)">
    <rect width="288" height="290" rx="12" fill="url(#cardBg)" stroke="#223348" stroke-width="1.2" />
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#00F2FE" stroke-width="2" class="pulse-border" />
    
    <!-- Header -->
    <g transform="translate(20, 26)">
      <text fill="#00F2FE" font-size="10.5" font-weight="700" class="mono" letter-spacing="1.5">01 // DISTRIBUTED &amp; DATA</text>
      <text y="22" fill="#FFFFFF" font-size="15" font-weight="700" class="sans">Lakehouse &amp; Graph Scale</text>
      <text y="40" fill="#718BAA" font-size="11" class="mono">Billions-scale ingestion &amp; queries</text>
    </g>

    <!-- Tech Chips (Grid) -->
    <g transform="translate(20, 94)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="76" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="38" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">PySpark</text>

      <rect x="84" y="0" width="94" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="131" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Apache Iceberg</text>

      <rect x="186" y="0" width="62" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="217" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">MinIO</text>

      <!-- Row 2 -->
      <rect x="0" y="34" width="78" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="39" y="51" fill="#00F2FE" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Neo4j Graph</text>

      <rect x="86" y="34" width="86" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="129" y="51" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">PostgreSQL</text>

      <rect x="180" y="34" width="68" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="214" y="51" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">FastAPI</text>

      <!-- Row 3 -->
      <rect x="0" y="68" width="64" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="32" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Docker</text>

      <rect x="72" y="68" width="112" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="128" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Entity Resolution</text>

      <rect x="192" y="68" width="56" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="220" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Zingg</text>
    </g>

    <!-- Capabilities Footer -->
    <g transform="translate(20, 222)">
      <line x1="0" y1="0" x2="248" y2="0" stroke="#1D2E42" stroke-width="1" />
      <text y="24" fill="#6A87A8" font-size="10" font-weight="500" class="mono">› Louvain Community Detection</text>
      <text y="42" fill="#6A87A8" font-size="10" font-weight="500" class="mono">› PageRank &amp; Centrality Graphs</text>
      <text y="60" fill="#00F2FE" font-size="10" font-weight="600" class="mono">› ACID Transactions &amp; RBAC</text>
    </g>
  </g>

  <!-- COLUMN 2: AGENTIC AI & COMPUTER VISION -->
  <g transform="translate(306, 0)">
