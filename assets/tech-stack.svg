      <text y="40" fill="#718BAA" font-size="11" class="mono">Multi-Agent RAG &amp; DGX A100</text>
    </g>

    <!-- Tech Chips (Grid) -->
    <g transform="translate(20, 94)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="88" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="44" y="17" fill="#00FFA3" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">LangGraph</text>

      <rect x="96" y="0" width="86" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="139" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">LangChain</text>

      <rect x="190" y="0" width="58" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="219" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Qwen 2.5</text>

      <!-- Row 2 -->
      <rect x="0" y="34" width="76" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="38" y="51" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">DeepEval</text>

      <rect x="84" y="34" width="68" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
