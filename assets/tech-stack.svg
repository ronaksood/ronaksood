    <g transform="translate(20, 94)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="62" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="31" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Python</text>

      <rect x="70" y="0" width="56" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="98" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">Java</text>

      <rect x="134" y="0" width="52" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="160" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">C++</text>

      <rect x="194" y="0" width="54" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="221" y="17" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">SQL</text>

      <!-- Row 2 -->
      <rect x="0" y="34" width="118" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="59" y="51" fill="#FFB800" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">System Design</text>

      <rect x="126" y="34" width="122" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="187" y="51" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">DSA &amp; Big-O</text>

      <!-- Row 3 -->
      <rect x="0" y="68" width="76" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="38" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">REST APIs</text>

      <rect x="84" y="68" width="76" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="122" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">CI/CD</text>

      <rect x="168" y="68" width="80" height="26" rx="5" fill="url(#chipBg1)" stroke="#24374E" stroke-width="1" />
      <text x="208" y="85" fill="#E2EDF8" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">React.js</text>
