      <text x="208" y="85" fill="#00FFA3" font-size="10.5" font-weight="600" class="mono" text-anchor="middle">DGX A100</text>
    </g>

    <!-- Capabilities Footer -->
    <g transform="translate(20, 222)">
      <line x1="0" y1="0" x2="248" y2="0" stroke="#1D2E42" stroke-width="1" />
      <text y="24" fill="#6A87A8" font-size="10" font-weight="500" class="mono">› Multi-Agent STAIR (93% Score)</text>
      <text y="42" fill="#6A87A8" font-size="10" font-weight="500" class="mono">› Guardrails &amp; Anti-Hallucination</text>
      <text y="60" fill="#00FFA3" font-size="10" font-weight="600" class="mono">› Polar Transform &amp; Dynamic ROI</text>
    </g>
  </g>

  <!-- COLUMN 3: CORE CS & SYSTEMS ENGINEERING -->
  <g transform="translate(612, 0)">
    <rect width="288" height="290" rx="12" fill="url(#cardBg)" stroke="#223348" stroke-width="1.2" />
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#FFB800" stroke-width="2" class="pulse-border" />
    
    <!-- Header -->
    <g transform="translate(20, 26)">
      <text fill="#FFB800" font-size="10.5" font-weight="700" class="mono" letter-spacing="1.5">03 // CORE CS &amp; SYSTEMS</text>
      <text y="22" fill="#FFFFFF" font-size="15" font-weight="700" class="sans">Algorithmic Excellence</text>
      <text y="40" fill="#718BAA" font-size="11" class="mono">Low-latency &amp; Clean Architecture</text>
