      <line x1="0" y1="0" x2="248" y2="0" stroke="#1D2E42" stroke-width="1" />
      <text y="24" fill="#6A87A8" font-size="10" font-weight="500" class="mono">› Indexing &amp; Query Optimization</text>
      <text y="42" fill="#6A87A8" font-size="10" font-weight="500" class="mono">› OOP, Concurrency &amp; Threading</text>
