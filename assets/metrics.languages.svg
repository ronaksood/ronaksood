<svg xmlns="http://www.w3.org/2000/svg" width="480" height="165" viewBox="0 0 480 165">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #39d353; }
      .lang-name { font-family: ui-monospace, 'SF Mono', monospace; font-size: 11.5px; fill: #c9d1d9; }
      .lang-pct { font-family: ui-monospace, 'SF Mono', monospace; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="480" height="165" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <text x="24" y="28" class="title">Most Used Languages</text>

  <!-- Progress Bar (Total width: 432px) -->
  <g transform="translate(24, 42)">
    <rect x="0" y="0" width="183" height="8" rx="4" fill="#3572A5" />
    <rect x="185" y="0" width="104" height="8" rx="0" fill="#b07219" />
    <rect x="291" y="0" width="71" height="8" rx="0" fill="#f34b7d" />
    <rect x="364" y="0" width="44" height="8" rx="0" fill="#e38c00" />
    <rect x="410" y="0" width="22" height="8" rx="4" fill="#f1e05a" />
  </g>

  <!-- Legend Row 1 -->
  <g transform="translate(24, 76)">
    <circle cx="5" cy="5" r="4.5" fill="#3572A5" />
    <text x="16" y="9" class="lang-name">Python <tspan class="lang-pct">42.4%</tspan></text>

    <circle cx="160" cy="5" r="4.5" fill="#b07219" />
    <text x="171" y="9" class="lang-name">Java <tspan class="lang-pct">24.1%</tspan></text>

    <circle cx="310" cy="5" r="4.5" fill="#f34b7d" />
    <text x="321" y="9" class="lang-name">C++ <tspan class="lang-pct">16.5%</tspan></text>
  </g>

  <!-- Legend Row 2 -->
  <g transform="translate(24, 114)">
    <circle cx="5" cy="5" r="4.5" fill="#e38c00" />
    <text x="16" y="9" class="lang-name">SQL <tspan class="lang-pct">10.2%</tspan></text>

    <circle cx="160" cy="5" r="4.5" fill="#f1e05a" />
    <text x="171" y="9" class="lang-name">JavaScript <tspan class="lang-pct">6.8%</tspan></text>

    <circle cx="310" cy="5" r="4.5" fill="#563d7c" />
    <text x="321" y="9" class="lang-name">Other <tspan class="lang-pct">0.0%</tspan></text>
  </g>
</svg>
