<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="100%" height="16">
  <defs>
    <!-- COLOR SYSTEM: Laser Divider -->
    <linearGradient id="dividerTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#162232" stop-opacity="0" />
      <stop offset="15%" stop-color="#22364E" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#385474" stop-opacity="1" />
      <stop offset="85%" stop-color="#22364E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#162232" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FFA3" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes glidePulse {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(950px); }
      }
      .laser-head {
        animation: glidePulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Base Track -->
  <line x1="20" y1="8" x2="880" y2="8" stroke="url(#dividerTrack)" stroke-width="1.2" />

  <!-- Center Diamond Anchor -->
  <g transform="translate(450, 8)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#00FFA3" filter="url(#divGlow)" />
  </g>

  <!-- Animated Comet Glider -->
  <g class="laser-head">
    <ellipse cx="0" cy="8" rx="80" ry="2" fill="url(#laserPulse)" filter="url(#divGlow)" />
  </g>
</svg>
