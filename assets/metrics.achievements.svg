<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">
  <defs>
    <style>
      .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .badge-sub { font-family: ui-monospace, 'SF Mono', monospace; font-size: 10.5px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="700" height="120" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Badge 1: 7x Hackathon Winner -->
  <g transform="translate(35, 24)">
    <circle cx="36" cy="36" r="32" fill="#1f242c" stroke="#FFB800" stroke-width="2" />
    <text x="36" y="44" font-size="24" text-anchor="middle">🏆</text>
    <text x="82" y="32" class="badge-title">7× Hackathon Winner</text>
    <text x="82" y="49" class="badge-sub">₹200K+ Haul • National Level</text>
  </g>

  <!-- Badge 2: Best Intern @ Grok Digital -->
  <g transform="translate(265, 24)">
    <circle cx="36" cy="36" r="32" fill="#1f242c" stroke="#39d353" stroke-width="2" />
    <text x="36" y="44" font-size="24" text-anchor="middle">⚡</text>
    <text x="82" y="32" class="badge-title">Best Intern Award</text>
    <text x="82" y="49" class="badge-sub">Grok Digital • Aramco CV</text>
  </g>

  <!-- Badge 3: Academic Rank 1 -->
  <g transform="translate(495, 24)">
    <circle cx="36" cy="36" r="32" fill="#1f242c" stroke="#388bfd" stroke-width="2" />
    <text x="36" y="44" font-size="24" text-anchor="middle">🎓</text>
    <text x="82" y="32" class="badge-title">MCA Rank #1</text>
    <text x="82" y="49" class="badge-sub">Panjab University (84%)</text>
  </g>
</svg>
