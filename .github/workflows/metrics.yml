name: Generate Profile Metrics

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Deep Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ronaksood
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_order: base.header, languages, activity
          
          # Languages breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          
          # Lines of code added/deleted
          plugin_lines: yes
          plugin_lines_history_limit: 2
          
          # Output configuration
          filename: assets/github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: auto-update github profile metrics [skip ci]"
