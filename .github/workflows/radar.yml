name: Generate Radars and Cards

on:
  schedule:
    # Run once daily at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "assets/skills.json"
      - "assets/projects.json"
      - "scripts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Draw radars
        run: |
          python scripts/radar.py --data assets/skills.json -o assets/radar
          python scripts/radar.py --github ${{ github.repository_owner }} -o assets/radar-langs \
            --limit 7 --values --curve 0.4 \
            --exclude "shell,makefile,dockerfile,batchfile,procfile"
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Draw cards
        run: |
          python scripts/cards.py --user ${{ github.repository_owner }} --out assets
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: refresh charts and cards [skip ci]" || exit 0
          git push
